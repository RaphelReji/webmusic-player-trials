<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <img src="images/light.gif" id="light-gif">
    <img src="images/partylight.gif" id="partylight-gif">
    <img src="images/headphonemonkey.gif" id="headphonemonkey">
    <img src="images/music1.gif" id="music-notes">

     <audio src="" id="audio"></audio>

   <div class="music-player">
     <h1 class="music-name">song one</h1>
     <p class="artist-name">artist</p>

     <div class="disk"></div>
     

     <div class="song-slider">
      <input type="range" value="0" class="seek-bar">  
      <span class="current-time">00:00</span>
      <span class="song-duration">00:00</span>
     </div>

     <div class="controls">
        <button class="btn backward-btn"><img src="images/pre.png" alt=""></button>
          <button class="play-btn pause">
            <span></span>
            <span></span>
          </button>
          <button class="btn forward-btn"><img src="images/nxt.png" alt=""></button>
     </div>

   </div>


        <button class="side-open" onclick="openSidePanel()">
            <span></span>
            <span></span>
            <span></span>
          </button>


<aside class="side-panel" id="sidePanel">
    <div class="side-panel-header">
        <h2>Appearance</h2>

        <button class="side-close" onclick="closeSidePanel()">
            &times;
        </button>
    </div>

    <div id="appearance-window-select">
      <div id="appearance-select-stngs">Settings</div>
      <div id="appearance-select-wids">Widgets</div>
    </div>
    <hr>
<main id="Settings-main">
    <div id="main-theme-window">

      <h2 id="main-theme-window-h1">Theme</h2>
    <div class="side-panel-appearance">
        
        <div id="white-theme-btn" class="theme-btns"></div>
        <div id="black-theme-btn" class="theme-btns"></div>
        <div id="blue-theme-btn" class="theme-btns"></div>
        <div id="red-theme-btn" class="theme-btns"></div>
        <div id="green-theme-btn" class="theme-btns"></div>
        <div id="yellow-theme-btn" class="theme-btns"></div>
        <div id="orange-theme-btn" class="theme-btns"></div>

    </div>

    </div>

    <div id="appearance-background-window">
        <h2 class="appearance-background-window-h1">Backgrounds</h2>
        <div id="bgimg-settings-grid">
        <img src="images/bluepixel.png" class="bgimg-settings">
        <img src="images/car.png" class="bgimg-settings">
        <img src="images/jungle.jpg" class="bgimg-settings">
        <img src="images/night.jpg" class="bgimg-settings">
      </div>   
    </div>

   

    <div id="cool-btn">Something cool</div>

    <div id="sign-out-btn">Sign out</div>

    <div id="login-yet-window">
      <button id="login-close">
            &times;
        </button>
      <div id="login-yet-window-text">You didn't login yet lol</div>
    </div>

    <div id="version-text">v1.67</div>
</main>

<main id="widgets-main">
  <div>
  
    <div class="widgets-grid">

      <div>Dancing monkey</div>

   <div>  
    <button id="dancing-monkey-btn" class="add-btns">
     <h3 id="add-monkey-btn">add</h3>
    </button>
   </div>


    </div>

        <div class="widgets-grid">

      <div>Disco light</div>

 <div>  
    <button id="dancing-disco-btn" class="add-btns">
     <h3 id="add-disco-btn">add</h3>
    </button>
   </div>

    </div>


            <div class="widgets-grid">

      <div>Light</div>

 <div>  
    <button id="dancing-monkey-btn" class="add-btns">
     <h3 id="add-monkey-btn">add</h3>
    </button>
   </div>

    </div>


           <div class="widgets-grid">

      <div>Music Notes</div>

   <div>  
    <button id="dancing-monkey-btn" class="add-btns">
     <h3 id="add-monkey-btn">add</h3>
    </button>
   </div>

    </div>


  </div>

</main>

</aside>


<div class="side-overlay" id="sideOverlay" onclick="closeSidePanel()"></div>

    
    <script src="data.js"></script>
    <script src="app.js"></script>
    
</body>
</html>
